# Local Persistent File-based Database Profile (Saves data permanently to disk)
spring:
  datasource:
    url: jdbc:h2:file:./data/fixit_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Web-based database viewer at http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.fixit: INFO

fixit:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000/api/v1}
