server:
  port: ${PORT:8080}

spring:
  application:
    name: fixit-backend

  # PostgreSQL Database Configuration via Environment Variables
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fixit_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      minimum-idle: 2
      maximum-pool-size: 10

  # Spring Data JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.fixit: DEBUG

fixit:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000/api/v1}
