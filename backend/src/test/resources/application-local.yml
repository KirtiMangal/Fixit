# Test Profile (in-memory, clean slate for each test run)
spring:
  datasource:
    url: jdbc:h2:mem:fixit_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

logging:
  level:
    root: WARN
    com.fixit: INFO

fixit:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000/api/v1}
